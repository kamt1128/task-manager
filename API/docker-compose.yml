version: '3.8'
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgres://user:password@db:5432/tasksdb
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  db_data: